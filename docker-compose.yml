version: "3.9"

services:

  upload-service:
    build: ./upload-service
    ports:
      - "8000:8000"
    depends_on:
      - minio
      - rabbitmq
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "upload-service"}]'

  audio-service:
    build: ./audio-service
    depends_on:
      - minio
      - rabbitmq
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "audio-service"}]'

  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    command: server /data --console-address ":9001"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  datadog:
    image: gcr.io/datadoghq/agent:latest
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=datadoghq.eu
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_ENV=dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro


  transcription-service:
    build: ./transcription-service
    depends_on:
      - minio
      - rabbitmq
    environment:
      - SERVICE_NAME=transcription-service
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin12345
      - MINIO_BUCKET=therapy-sessions
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - AUDIO_READY_QUEUE=audio_ready
      - TRANSCRIPT_READY_QUEUE=transcript_ready
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "transcription-service"}]'


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  analysis-service:
    build: ./analysis-service
    depends_on:
      - minio
      - rabbitmq
      - redis
    environment:
      - SERVICE_NAME=analysis-service
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin12345
      - MINIO_BUCKET=therapy-sessions
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - TRANSCRIPT_READY_QUEUE=transcript_ready
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4.1-mini
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "analysis-service"}]'



